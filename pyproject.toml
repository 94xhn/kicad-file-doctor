[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-file-doctor"
version = "0.1.0"
description = "Explain why KiCad rejects (or silently mis-loads) a .kicad_pcb / .kicad_sch file - with line numbers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "94xhn" }]
keywords = ["kicad", "pcb", "eda", "diagnostics", "lint", "s-expression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
kicad-file-doctor = "kicad_file_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/94xhn/kicad-file-doctor"
Issues = "https://github.com/94xhn/kicad-file-doctor/issues"
Changelog = "https://github.com/94xhn/kicad-file-doctor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["kicad_file_doctor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
